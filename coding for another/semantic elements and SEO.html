<!--Write a short note on HTML5 semantic elements and their role in SEO. Give a sample page structure using these elements.-->
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">
    <title>Sample Semantic Page</title>
</head>
<body>
    <header>
        <h1>My Website</h1>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <section>
        <article>
            <h2>Article Title</h2>
            <p>This is an article with meaningful content.</p>
        </article>

        <aside>Related Links / Information</aside>
    </section>

    <footer>
        <p>© 2026 My Website. All rights reserved.</p>
    </footer>
</body>
</html>
