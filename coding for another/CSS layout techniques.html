<!--Explain CSS layout techniques with examples, including display, positioning, float and clear-->
<style>
.container {
    border: 1px solid #ccc;
    padding: 10px;
}

img {
    float: left;
    margin-right: 15px;
}

.content {
    overflow: auto;
}
</style>

<div class="container">
    <img src="photo.jpg" alt="Image">
    <div class="content">
        <h3>CSS Layout Example</h3>
        <p>Image is floated left and text flows beside it.</p>
    </div>
</div>
