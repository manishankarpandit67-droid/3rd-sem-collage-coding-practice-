<!--Example of HTML5 form validation-->
<form>
    <label>Name:</label>
    <input type="text" required><br>

    <label>Email:</label>
    <input type="email" required><br>

    <label>Age:</label>
    <input type="number" min="18" max="60" required><br>

    <input type="submit" value="Register">
</form>
